<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Offline | Automata</title>
    <style>
        @font-face {
            font-family: "JetBrains Mono";
            src: local("JetBrains Mono");
        }
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #e5e7eb;
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            padding: 24px;
        }
        .wrap { max-width: 560px; width: 100%; }
        .stamp { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ef4444; margin-right: 8px; }
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 24px; letter-spacing: -0.02em; }
        .panel { border: 1px solid #1f2937; background: #0d1117; }
        .chrome { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #1f2937; }
        .chrome i { width: 11px; height: 11px; border-radius: 50%; display: block; }
        .body { padding: 20px; font-size: 13px; line-height: 1.7; }
        .g { color: #4ade80; }
        .m { color: #6b7280; }
        .r { color: #ef4444; }
        a.btn {
            display: inline-block; margin-top: 20px; padding: 8px 16px;
            border: 1px solid #4ade80; color: #4ade80; text-decoration: none; font-size: 13px;
        }
        a.btn:hover { background: #4ade80; color: #000; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="stamp"><span class="dot"></span>NETWORK UNREACHABLE</div>
        <h1><span class="r">o</span><span class="g">f</span><span class="r">f</span>line</h1>
        <div class="panel">
            <div class="chrome">
                <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
            </div>
            <div class="body">
                <div><span class="g">$</span> ping automata.pe</div>
                <div class="r">ping: cannot resolve host — you appear to be offline</div>
                <div style="margin-top:12px"><span class="g">$</span> ls ./cache</div>
                <div class="m">// previously visited pages are still available offline</div>
                <div style="margin-top:12px" class="m">// reconnect and retry, or jump back to a cached page</div>
            </div>
        </div>
        <a class="btn" href="/">$ retry --home</a>
    </div>
</body>
</html>
